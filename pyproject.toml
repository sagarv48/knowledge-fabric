[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-fabric"
version = "0.1.0"
description = "MCP-native evidence retrieval platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Knowledge Fabric Contributors" }
]
dependencies = [
  "requests>=2.31.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
