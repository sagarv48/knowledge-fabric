[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-fabric"
version = "0.1.0"
description = "MCP-native evidence retrieval platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Knowledge Fabric Contributors" }
]
dependencies = [
  "requests>=2.31.0",
  "PyYAML>=6.0.1",
  "psycopg[binary]>=3.2.0",
  "mcp>=1.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
knowledge-fabric-mcp = "knowledge_fabric.mcp.server:run_mcp_server"
knowledge-fabric-ingest = "knowledge_fabric.ingestion.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
