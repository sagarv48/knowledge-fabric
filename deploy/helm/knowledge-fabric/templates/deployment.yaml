apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowledge-fabric.fullname" . }}
  labels:
    {{- include "knowledge-fabric.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "knowledge-fabric.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "knowledge-fabric.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "knowledge-fabric.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "knowledge-fabric.fullname" . }}-config
          env:
            - name: KF_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgresql.external.enabled }}
                  name: {{ .Values.postgresql.external.existingSecret }}
                  key: {{ .Values.postgresql.external.secretPasswordKey | default "password" }}
                  {{- else if .Values.postgresql.auth.existingSecret }}
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: {{ .Values.postgresql.auth.secretPasswordKey | default "postgres-password" }}
                  {{- else }}
                  name: {{ include "knowledge-fabric.fullname" . }}-postgres
                  key: postgres-password
                  {{- end }}
            - name: FABRIC_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.security.signingKey.existingSecret }}
                  name: {{ .Values.security.signingKey.existingSecret }}
                  key: {{ .Values.security.signingKey.existingSecretKey | default "fabric-signing-key" }}
                  {{- else }}
                  name: {{ include "knowledge-fabric.fullname" . }}-signing
                  key: fabric-signing-key
                  {{- end }}
            {{- if .Values.ai.openai.apiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "knowledge-fabric.fullname" . }}-openai
                  key: openai-api-key
            {{- else if .Values.ai.openai.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ai.openai.existingSecret }}
                  key: {{ .Values.ai.openai.existingSecretKey | default "openai-api-key" }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
