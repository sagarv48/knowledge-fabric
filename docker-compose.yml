services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledge-fabric-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_fabric}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_fabric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST_AUTH_METHOD: "trust"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_fabric -d knowledge_fabric"]
      interval: 5s
      timeout: 5s
      retries: 10

  tika:
    image: apache/tika:2.9.2.1
    container_name: knowledge-fabric-tika
    ports:
      - "9998:9998"

  ollama:
    image: ollama/ollama:latest
    container_name: knowledge-fabric-ollama
    profiles: ["local-ai", "all"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
