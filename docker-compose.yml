version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kf-postgres
    restart: always
    environment:
      POSTGRES_USER: kf_user
      POSTGRES_PASSWORD: kf_password
      POSTGRES_DB: knowledge_fabric
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kf_user -d knowledge_fabric"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - kf_pgdata:/var/lib/postgresql/data
      - ./db/schema:/docker-entrypoint-initdb.d:ro

  knowledge-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kf-mcp-server
    restart: unless-stopped
    entrypoint: []
    command: fastmcp run src/knowledge_fabric/mcp/server.py --transport sse --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://kf_user:kf_password@postgres:5432/knowledge_fabric
    depends_on:
      postgres:
        condition: service_healthy

  smoke-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kf-smoke-test
    entrypoint: []
    command: python scripts/verify_mcp_health.py --url http://knowledge-mcp:8000/sse --timeout 30
    depends_on:
      - knowledge-mcp

volumes:
  kf_pgdata:
